# CI/CD handled by PaaS (platform.hanzo.ai) via webhook
# This workflow only validates the build
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Validate startup
        run: timeout 5 node src/server.mjs || true
        env:
          PORT: 8080
